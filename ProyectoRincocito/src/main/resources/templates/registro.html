<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta - TU RINCONCITO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="card border-0 shadow-sm rounded-4 p-4 mx-auto" style="max-width: 680px">
      <div class="text-center mb-4">
        <img th:src="@{/img/logo_sin_fondo_BODEGA.png}" alt="Tu Rinconcito" width="120" height="80">
        <h1 class="h3 text-success fw-bold">Crear cuenta de cliente</h1>
        <p class="text-secondary">Regístrate para comprar en Tu Rinconcito.</p>
      </div>

      <div th:if="${registroError}" class="alert alert-danger" role="alert" th:text="${registroError}"></div>

      <form th:action="@{/registro-cliente}" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" class="form-control" name="nombre" autocomplete="given-name" required>
          </div>
          <div class="col-md-6">
            <label for="apellido" class="form-label">Apellido</label>
            <input id="apellido" class="form-control" name="apellido" autocomplete="family-name" required>
          </div>
          <div class="col-md-6">
            <label for="documento" class="form-label">Documento</label>
            <input id="documento" class="form-control" name="documento" required>
          </div>
          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input id="telefono" class="form-control" name="telefono" autocomplete="tel">
          </div>
          <div class="col-12">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input id="correo" type="email" class="form-control" name="correo" autocomplete="email" required>
          </div>
          <div class="col-md-6">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" name="password" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="col-md-6">
            <label for="confirmarPassword" class="form-label">Confirmar contraseña</label>
            <input id="confirmarPassword" type="password" class="form-control" name="confirmarPassword" minlength="8" autocomplete="new-password" required>
          </div>
          <div class="col-12 form-check ms-2">
            <input id="aceptarTerminos" class="form-check-input" type="checkbox" name="aceptarTerminos" value="true" required>
            <label for="aceptarTerminos" class="form-check-label">Acepto los términos y condiciones.</label>
          </div>
          <div class="col-12 d-grid">
            <button class="btn btn-primary" type="submit">Crear cuenta</button>
          </div>
        </div>
      </form>

      <div class="text-center mt-4">
        <a th:href="@{/login(modulo='Cliente')}">Ya tengo una cuenta</a>
        <span class="mx-2 text-secondary">·</span>
        <a th:href="@{/}">Volver a la tienda</a>
      </div>
    </div>
  </main>
</body>
</html>
