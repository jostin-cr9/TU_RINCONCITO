<!DOCTYPE html>
<html lang="es"  xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos - TU RINCONCITO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="row g-0 min-vh-100 align-content-start align-content-lg-stretch">
  <!-- Barra lateral: fija en pantallas grandes, menú desplegable (offcanvas) en móviles -->
  <div class="col-lg-3 col-xl-2 bg-dark" data-bs-theme="dark">
    <aside class="offcanvas-lg offcanvas-start bg-dark sticky-lg-top vh-100 d-flex flex-column" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
      <div class="offcanvas-header d-flex border-bottom border-secondary">
        <div id="sidebarLabel">
          <div class="fs-5 fw-bold text-white"><i class="bi bi-shop me-2"></i>TU RINCONCITO</div>
          <small class="text-white-50">Intranet de bodega</small>
        </div>
        <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column flex-grow-1 p-3">
        <nav class="nav nav-pills flex-column gap-1">
            <a class="nav-link link-body-emphasis" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a class="nav-link active" aria-current="page" th:href="@{/productos}"><i class="bi bi-box-seam me-2"></i>Productos</a>
            <a class="nav-link link-body-emphasis" th:href="@{/inventario}"><i class="bi bi-clipboard-data me-2"></i>Inventario</a>
            <a class="nav-link link-body-emphasis" th:href="@{/movimientos}"><i class="bi bi-arrow-left-right me-2"></i>Entradas y salidas</a>
            <a class="nav-link link-body-emphasis" th:href="@{/ventas}"><i class="bi bi-receipt me-2"></i>Ventas</a>
            <a class="nav-link link-body-emphasis" th:href="@{/clientes}"><i class="bi bi-people me-2"></i>Clientes</a>
            <a class="nav-link link-body-emphasis" th:href="@{/proveedores}"><i class="bi bi-truck me-2"></i>Proveedores</a>
            <a class="nav-link link-body-emphasis" th:href="@{/reportes}"><i class="bi bi-bar-chart me-2"></i>Reportes</a>
            <a class="nav-link link-body-emphasis" th:href="@{/usuarios}"><i class="bi bi-person-gear me-2"></i>Usuarios</a>
        </nav>
        <div class="mt-auto pt-3 border-top border-secondary">
          <a class="nav-link link-danger" th:href="@{/login}"><i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión</a>
        </div>
      </div>
    </aside>
  </div>

  <div class="col-lg-9 col-xl-10">
    <header class="d-flex justify-content-between align-items-center bg-white border-bottom px-3 px-md-4 py-3 sticky-top">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
        <h1 class="h4 mb-0">Productos</h1>
      </div>
      <span class="text-muted small"><i class="bi bi-person-circle"></i> Administrador</span>
    </header>

    <main class="p-3 p-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0">Gestión del catálogo de productos.</p>
        <button class="btn btn-verde" data-bs-toggle="modal" data-bs-target="#modalProducto">
          <i class="bi bi-plus-lg"></i> Nuevo producto
        </button>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table mb-0" id="tablaProductos">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="producto : ${productos}">
                <td th:text="${producto.id}"></td>
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.categoria}"></td>
                <td th:text="${producto.precio}"></td>
                <td th:text="${producto.stock}"></td>
                <td><span class="badge" th:classappend="${producto.stock == 0 ? ' text-bg-danger' : (producto.stock < 10 ? ' text-bg-warning' : ' badge-disponible')}" th:text="${producto.stock == 0 ? 'Agotado' : (producto.stock < 10 ? 'Stock bajo' : 'Disponible')}"></span></td>
                <td><form th:action="@{/productos/{id}/eliminar(id=${producto.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

  <div class="modal fade" id="modalProducto" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formProducto" th:action="@{/productos/guardar}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">Producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
<div class="mb-3">
              <label class="form-label" for="prodNombre">Nombre</label>
              <input type="text" class="form-control" id="prodNombre" name="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="prodDescripcion">Descripción</label>
              <input type="text" class="form-control" id="prodDescripcion" name="descripcion" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="prodCategoria">Categoría</label>
              <select class="form-select" id="prodCategoria" name="categoria" required>
                <option value="">Seleccione</option>
                <option>Abarrotes</option>
                <option>Bebidas</option>
                <option>Lácteos</option>
                <option>Snacks</option>
                <option>Limpieza</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="prodPrecio">Precio</label>
              <input type="number" step="0.01" class="form-control" id="prodPrecio" name="precio" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="prodStock">Stock</label>
              <input type="number" class="form-control" id="prodStock" name="stock" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-verde">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
