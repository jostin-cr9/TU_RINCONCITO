<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intranet - TU RINCONCITO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container py-5">
    <div class="card shadow border-0 rounded-4 p-4 w-100 col-12 col-md-8 col-lg-5 col-xl-4 mx-auto">
      <div class="text-center mb-4">
        <img th:src="@{/img/logo_sin_fondo_BODEGA.png}" alt="logo" width="120" height="80" class="mb-2">
        <h1 class="h4 text-success mb-1 fw-bold">TU RINCONCITO</h1>
        <p class="text-muted small mb-0">Intranet del personal</p>
      </div>

      <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

      <form id="formLogin" th:action="@{/login}" method="post">
        <div class="mb-3 fw-bold">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ingrese su usuario" required>
        </div>
        <div class="mb-3 fw-bold">
          <label for="clave" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="clave" name="clave" placeholder="Ingrese su contraseña" required>
        </div>
        <button type="submit" class="btn btn-success w-100 rounded-3">
        Iniciar sesión
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="#" data-bs-toggle="modal" data-bs-target="#modalRecuperar">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="text-center mt-3">
       <a th:href="@{/}" class="small text-muted text-decoration-none">
    <i class="bi bi-arrow-left"></i> Volver al sitio web
        </a>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalRecuperar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formRecuperar">
          <div class="modal-header">
            <h5 class="modal-title">Recuperar contraseña</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <label for="correoRecuperar" class="form-label">Correo o usuario</label>
            <input type="text" class="form-control" id="correoRecuperar" required>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Login de la intranet. Por ahora valida contra una cuenta de prueba
    // porque todavía no está conectado el backend (Spring Security/JWT).
    // Cuando esté listo el backend, este bloque se reemplaza por el fetch al endpoint de login.
    document.getElementById('formLogin').addEventListener('submit', function (e) {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value.trim();
      const clave = document.getElementById('clave').value.trim();
      const alerta = document.getElementById('loginAlerta');

      const USUARIO_DEMO = 'admin';
      const CLAVE_DEMO = 'admin123';

      if (usuario === USUARIO_DEMO && clave === CLAVE_DEMO) {
        sessionStorage.setItem('rinconcitoAuth', 'ok');
        window.location.href = '/dashboard';
      } else {
        alerta.textContent = 'Usuario o contraseña incorrectos.';
        alerta.classList.remove('d-none');
        alerta.classList.add('alert-danger');
      }
    });
  </script>
</body>

</html>
