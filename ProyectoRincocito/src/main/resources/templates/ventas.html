<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas - TU RINCONCITO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<div class="row g-0 min-vh-100 align-content-start align-content-lg-stretch">

  <div class="col-lg-3 col-xl-2 bg-dark" data-bs-theme="dark">
    <aside class="offcanvas-lg offcanvas-start bg-dark sticky-lg-top vh-100 d-flex flex-column" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
      <div class="offcanvas-header d-flex border-bottom border-secondary">
        <div id="sidebarLabel">
          <div class="fs-5 fw-bold text-white"><i class="bi bi-shop me-2"></i>TU RINCONCITO</div>
          <small class="text-white-50">Intranet de bodega</small>
        </div>
        <button type="button" class="btn-close d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column flex-grow-1 p-3">
        <nav class="nav nav-pills flex-column gap-1">
            <a class="nav-link link-body-emphasis" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a class="nav-link link-body-emphasis" th:href="@{/productos}"><i class="bi bi-box-seam me-2"></i>Productos</a>
            <a class="nav-link link-body-emphasis" th:href="@{/inventario}"><i class="bi bi-clipboard-data me-2"></i>Inventario</a>
            <a class="nav-link link-body-emphasis" th:href="@{/movimientos}"><i class="bi bi-arrow-left-right me-2"></i>Entradas y salidas</a>
            <a class="nav-link active" aria-current="page" th:href="@{/ventas}"><i class="bi bi-receipt me-2"></i>Ventas</a>
            <a class="nav-link link-body-emphasis" th:href="@{/clientes}"><i class="bi bi-people me-2"></i>Clientes</a>
            <a class="nav-link link-body-emphasis" th:href="@{/proveedores}"><i class="bi bi-truck me-2"></i>Proveedores</a>
            <a class="nav-link link-body-emphasis" th:href="@{/reportes}"><i class="bi bi-bar-chart me-2"></i>Reportes</a>
            <a class="nav-link link-body-emphasis" th:href="@{/usuarios}"><i class="bi bi-person-gear me-2"></i>Usuarios</a>
        </nav>
        <div class="mt-auto pt-3 border-top border-secondary">
          <a class="nav-link link-danger" th:href="@{/login}"><i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión</a>
        </div>
      </div>
    </aside>
  </div>

  <div class="col-lg-9 col-xl-10">
    <header class="d-flex justify-content-between align-items-center bg-white border-bottom px-3 px-md-4 py-3 sticky-top">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
        <h1 class="h4 mb-0">Ventas</h1>
      </div>
      <span class="text-muted small"><i class="bi bi-person-circle"></i> Administrador</span>
    </header>

    <main class="p-3 p-md-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0">Registro e historial de ventas.</p>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalVenta">
          Registrar venta
        </button>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table mb-0" id="tablaVentas">
            <thead>
              <tr>
                <th>N.º venta</th>
                <th>Cliente</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Total</th>
                <th>Fecha</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="detalle : ${detallesVenta}">
                <td th:text="${detalle.venta.id}"></td>
                <td th:text="${detalle.venta.cliente != null ? detalle.venta.cliente.nombre : 'Cliente general'}"></td>
                <td th:text="${detalle.producto.nombre}"></td>
                <td th:text="${detalle.cantidad}"></td>
                <td th:text="${detalle.precioUnitario}"></td>
                <td th:text="${detalle.subtotal}"></td>
                <td th:text="${#temporals.format(detalle.venta.fecha, 'yyyy-MM-dd')}"></td>
                <td>
                  <form th:action="@{/detalles-venta/{id}/eliminar(id=${detalle.id})}" method="post">
                    <button class="btn btn-sm btn-outline-danger" type="submit" title="Eliminar detalle"><i class="bi bi-trash"></i></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

  <div class="modal fade" id="modalVenta" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formVenta" th:action="@{/ventas/guardar}" th:object="${ventaFormulario}" method="post">
          <div class="modal-header">
            <h5 class="modal-title">Registrar venta</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
<div class="mb-3">
              <label class="form-label" for="ventaCliente">Cliente</label>
              <select class="form-select" id="ventaCliente" th:field="*{clienteId}"><option value="">Cliente general</option><option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre}"></option></select>
              <div class="text-danger" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="ventaProducto">Producto</label>
              <select class="form-select" id="ventaProducto" th:field="*{productoId}" required><option value="">Seleccione</option><option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.nombre}" th:disabled="${producto.stock == 0}" th:attr="data-precio=${producto.precio},data-stock=${producto.stock}"></option></select>
              <div class="text-danger" th:if="${#fields.hasErrors('productoId')}" th:errors="*{productoId}"></div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label" for="ventaCantidad">Cantidad</label>
                <input type="number" min="1" class="form-control" id="ventaCantidad" th:field="*{cantidad}" required>
                <div class="text-danger" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label" for="ventaPrecio">Precio</label>
                <input type="number" step="0.01" class="form-control" id="ventaPrecio" readonly>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label" for="ventaTotal">Total</label>
                <input type="text" class="form-control" id="ventaTotal" readonly>
              </div>
            </div>
            <div class="mb-0">
              <label class="form-label" for="ventaFecha">Fecha</label>
              <input type="date" class="form-control" id="ventaFecha" th:field="*{fecha}" required>
              <div class="text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success">Guardar venta</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:if="${mostrarFormulario}">
    document.addEventListener("DOMContentLoaded", function () {
      bootstrap.Modal.getOrCreateInstance(document.getElementById("modalVenta")).show();
    });
  </script>
  <script>
    const productoVenta = document.getElementById("ventaProducto");
    const cantidadVenta = document.getElementById("ventaCantidad");
    const precioVenta = document.getElementById("ventaPrecio");
    const totalVenta = document.getElementById("ventaTotal");
    function actualizarTotalVenta() {
      const opcion = productoVenta.selectedOptions[0];
      const precio = Number(opcion?.dataset.precio || 0);
      const cantidad = Number(cantidadVenta.value || 0);
      precioVenta.value = precio ? precio.toFixed(2) : "";
      totalVenta.value = (precio * cantidad).toFixed(2);
      cantidadVenta.max = opcion?.dataset.stock || "";
    }
    productoVenta.addEventListener("change", actualizarTotalVenta);
    cantidadVenta.addEventListener("input", actualizarTotalVenta);
    actualizarTotalVenta();
  </script>
</body>
</html>
